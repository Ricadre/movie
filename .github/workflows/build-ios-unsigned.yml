name: Build unsigned iOS IPA

on:
  workflow_dispatch:
  pull_request:
    branches:
      - open-source-v2.5.9

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Build unsigned IPA
        run: ./script/build_ios_ipa.sh

      - name: Run tests
        run: flutter test --no-pub

      - name: Upload IPA
        uses: actions/upload-artifact@v7
        with:
          name: catmovie-ios-unsigned
          path: build/ios/ipa/*.ipa
          if-no-files-found: error
          retention-days: 7
